name: linkchat_client
description: LinkChat P2P聊天客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # WebRTC - P2P核心
  flutter_webrtc: ^0.10.5

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 路由
  go_router: ^14.2.0

  # 工具库
  uuid: ^4.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0

  # 文件/图片选择
  image_picker: ^1.0.7
  file_picker: ^8.0.5

  # 阶段三：稳定身份（Ed25519 密钥对）
  cryptography: ^2.7.0
  # 注：flutter_secure_storage 在 Windows 上依赖 ATL/MFC，
  #     Visual Studio Build Tools 缺这两个组件。
  #     MVP 阶段私钥先用 Hive 存（base64），阶段四再加 secure_storage。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
